name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - demo/airmap-italia-gis
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out demo branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular app for GitHub Pages
        run: npm run build -- --base-href /airmap-italia-gis/

      - name: Add SPA route fallback
        run: cp dist/airmap-italia-gis/browser/index.html dist/airmap-italia-gis/browser/404.html

      - name: Add static entry points for Angular routes
        run: |
          for route in map dashboard analytics layers settings privacy-policy cookie-policy termini-servizio; do
            mkdir -p "dist/airmap-italia-gis/browser/$route"
            cp dist/airmap-italia-gis/browser/index.html "dist/airmap-italia-gis/browser/$route/index.html"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/airmap-italia-gis/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
