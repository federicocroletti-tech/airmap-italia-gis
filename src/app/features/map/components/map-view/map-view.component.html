<section class="map-shell" aria-label="Mappa qualita aria Milano">
  <div #mapContainer class="map-canvas"></div>

  <div class="map-actions" aria-label="Controlli mappa">
    <button
      mat-mini-fab
      type="button"
      (click)="resetView()"
      [matTooltip]="'MAP.RESET_VIEW' | translate"
      [attr.aria-label]="'MAP.RESET_VIEW' | translate"
    >
      <mat-icon>my_location</mat-icon>
    </button>
    <button
      mat-mini-fab
      type="button"
      (click)="toggleFullscreen()"
      [matTooltip]="'MAP.FULLSCREEN' | translate"
      [attr.aria-label]="'MAP.FULLSCREEN' | translate"
    >
      <mat-icon>fullscreen</mat-icon>
    </button>
  </div>
</section>
